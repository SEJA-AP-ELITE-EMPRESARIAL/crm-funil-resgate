# Conecta_CRM — stack isolada (backend Django + frontend nginx).
# Banco: funil-postgres na VPS db-sejaap (179.197.237.95), alcancado via db-tunnel (SSH).
# A porta 5434 do banco continua fechada para a internet.
#   docker compose up -d --build
name: conecta-crm

services:
  # Tunel SSH ate o db-sejaap. Backend usa DATABASE_URL apontando para db-tunnel:5434.
  db-tunnel:
    build: ./deploy/db-tunnel
    image: conecta-crm-db-tunnel:prod
    container_name: conecta-crm-db-tunnel
    restart: unless-stopped
    environment:
      TUNNEL_HOST: "179.197.237.95"
      TUNNEL_USER: "root"
      TUNNEL_PORT: "22"
    volumes:
      - /opt/conecta/env/db_tunnel_key:/keys/id:ro
      - /opt/conecta/env/db_tunnel_known_hosts:/keys/known_hosts:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build:
      context: ./backend
      args:
        # Commit da main deployada, passado no comando do deploy (TSK-1147):
        #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        # Fica gravado na imagem e é o `release` dos eventos no GlitchTip (o
        # SENTRY_DSN vem do .env). Build sem ele: eventos sem release.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: conecta-crm-backend
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db-tunnel
    expose:
      - "8000"
    networks:
      # `default` precisa estar AQUI. Declarar `networks` num serviço substitui
      # a rede padrão em vez de somar a ela — sem esta linha o backend sairia da
      # rede do compose e perderia o db-tunnel e o frontend de uma vez.
      - default
      # Rede do Conecta ID: é por aqui que o login central alcança
      # `identidade-api:8000` (o serviço não publica porta nenhuma).
      - identidade-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/crm/config/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # GlitchTip (TSK-1147): DSN do projeto `crm` para o navegador (vazio = SDK
        # desligado) e o commit do deploy como release, o mesmo GIT_COMMIT do backend.
        # O compose lê o VITE_SENTRY_DSN do .env ao lado deste arquivo.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${GIT_COMMIT:-}
        # Só "sim" ou vazio, nunca o token: o cache do BuildKit não enxerga o secret,
        # e sem isto um build com token reaproveitaria a camada de um build sem
        # token do mesmo commit, sem mandar os mapas.
        GLITCHTIP_ENVIA_MAPAS: ${GLITCHTIP_AUTH_TOKEN:+sim}
      # Token do GlitchTip (escopo project:releases) para enviar os source maps no
      # build. Vai como secret de build, fora das camadas e do histórico da imagem;
      # vazio = build sem mapas. Passe-o só no comando do deploy, NUNCA no .env: o
      # .env é o env_file do backend, e o token iria parar no ambiente do container.
      #   GLITCHTIP_AUTH_TOKEN="$(cat /opt/conecta/env/glitchtip_token)" \
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
      secrets:
        - glitchtip_token
    container_name: conecta-crm-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      # Exposto só no loopback; o nginx do HOST faz o proxy do subdomínio para cá.
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

secrets:
  # Só existe no build do frontend (ver o serviço). Sem a variável, o secret vem
  # vazio e o build segue sem source maps.
  glitchtip_token:
    environment: GLITCHTIP_AUTH_TOKEN

networks:
  # Criada e mantida pela stack do Conecta ID (/opt/identidade/app), que roda
  # nesta mesma VPS. `external: true` porque a dona é ela: se este compose
  # tentasse criar a rede, um `docker compose down` daqui a removeria por baixo
  # do serviço de identidade e derrubaria o login dos outros apps junto.
  #
  # Se a stack do Conecta ID nunca subiu nesta máquina, o `up` falha com
  # "network identidade-net declared as external, but could not be found" — o
  # que é melhor do que subir e só descobrir no primeiro login.
  identidade-net:
    name: identidade-net
    external: true
